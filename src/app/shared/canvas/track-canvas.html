<svg
  class="canvas"
  [class.dragging]="dragging()"
  [attr.viewBox]="view().box"
  role="img"
  [attr.aria-label]="'canvas.aria' | t"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (contextmenu)="onContextMenu($event)"
  (wheel)="onWheel($event)"
>
  <rect
    class="backdrop"
    [attr.x]="view().minX"
    [attr.y]="view().minY"
    [attr.width]="view().width"
    [attr.height]="view().height"
      />

  @if (floorLayer(); as floor) {
    <polygon class="floor" [attr.points]="floor.outer" />
    @for (obstacle of floor.obstacles; track obstacle.id) {
      <polygon class="obstacle" [attr.points]="obstacle.points" />
    }
  }

  <g class="grid">
    @for (x of grid().xs; track x) {
      <line [attr.x1]="x" [attr.x2]="x" [attr.y1]="view().minY" [attr.y2]="view().minY + view().height" />
    }
    @for (y of grid().ys; track y) {
      <line [attr.x1]="view().minX" [attr.x2]="view().minX + view().width" [attr.y1]="y" [attr.y2]="y" />
    }
  </g>

  @for (item of drawnParts(); track item.part.instanceId) {
    <g
      class="part"
      [attr.data-label]="item.part.label"
      [class.selected]="selectedLabel() === item.part.label"
      [class.flex-part]="!!item.part.flexPath?.length"
    >
      @if (item.showPolygon) {
          <polygon [attr.points]="item.points" [attr.fill]="item.spec.color" />
        }
        @if (item.curvePath) {
          <path class="body" [attr.transform]="item.transform" [attr.d]="item.curvePath" [attr.fill]="item.spec.color" />
        }
        @if (!item.outline && item.beds.length > 1) {
          @for (d of item.beds; track $index) {
            <path class="body outline" [attr.transform]="item.transform" [attr.d]="d" />
          }
        }
        @for (d of item.beds; track $index) {
          <path
            class="body"
            [class.overlay]="item.beds.length > 1"
            [attr.transform]="item.transform"
            [attr.d]="d"
            [attr.fill]="item.spec.color"
          />
        }
        @if (item.outline) {
          <path class="body outline" [attr.transform]="item.transform" [attr.d]="item.outline" />
        }
        @for (d of item.rails; track $index) {
          <path class="rail" [attr.transform]="item.transform" [attr.d]="d" />
        }
    </g>
  }

  @for (item of drawnParts(); track 'seam-' + item.part.instanceId) {
    @for (d of item.seams; track $index) {
      <path class="seam" [attr.d]="d" />
    }
  }

  @for (item of drawnParts(); track 'badge-' + item.part.instanceId) {
    <g
      class="part-badge"
      [attr.data-label]="item.part.label"
      [class.selected]="selectedLabel() === item.part.label"
    >
      <circle [attr.cx]="item.center.x" [attr.cy]="item.center.y" r="3.2" class="badge" />
      <text [attr.x]="item.center.x" [attr.y]="item.center.y" class="label">{{ item.part.label }}</text>
    </g>
  }

  @for (mark of layout().marks; track mark.kind + mark.text + mark.x + mark.y) {
    <text
      class="note"
      [class.park]="mark.kind === 'parking'"
      [class.reverse]="mark.kind === 'reverse'"
      [class.flex]="mark.kind === 'flex'"
      [class.open]="mark.kind === 'unfinished'"
      [attr.x]="mark.x"
      [attr.y]="mark.y"
    >{{ mark.text | t }}</text>
  }

  @if (hoverMeasure(); as measure) {
    <text class="measure" [attr.x]="measure.x" [attr.y]="measure.y">{{ measure.text }}</text>
  }
</svg>
