<svg
  class="canvas"
  [class.dragging]="dragging()"
  [attr.viewBox]="view().box"
  role="img"
  aria-label="LEGO City track layout"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (contextmenu)="onContextMenu($event)"
  (wheel)="onWheel($event)"
>
  <rect
    class="backdrop"
    [attr.x]="view().minX"
    [attr.y]="view().minY"
    [attr.width]="view().width"
    [attr.height]="view().height"
  />

  <g class="grid">
    @for (x of grid().xs; track x) {
      <line [attr.x1]="x" [attr.x2]="x" [attr.y1]="view().minY" [attr.y2]="view().minY + view().height" />
    }
    @for (y of grid().ys; track y) {
      <line [attr.x1]="view().minX" [attr.x2]="view().minX + view().width" [attr.y1]="y" [attr.y2]="y" />
    }
  </g>

  @for (item of drawnParts(); track item.part.instanceId) {
    <g
      class="part"
      [class.selected]="selectedLabel() === item.part.label"
      (click)="select(item.part)"
    >
      @if (item.path) {
        <path [attr.d]="item.path" [attr.stroke]="item.spec.color" fill="none" stroke-width="6" stroke-linecap="round" />
      } @else {
        @if (item.showPolygon) {
          <polygon [attr.points]="item.points" [attr.fill]="item.spec.color" />
        }
        @if (item.curvePath) {
          <path class="body" [attr.transform]="item.transform" [attr.d]="item.curvePath" [attr.fill]="item.spec.color" />
        }
      }
      <circle [attr.cx]="item.center.x" [attr.cy]="item.center.y" r="3.2" class="badge" />
      <text [attr.x]="item.center.x" [attr.y]="item.center.y" class="label">{{ item.part.label }}</text>
    </g>
  }

  @for (mark of layout().marks; track mark.kind + mark.text + mark.x + mark.y) {
    <text
      class="note"
      [class.park]="mark.kind === 'parking'"
      [class.reverse]="mark.kind === 'reverse'"
      [class.flex]="mark.kind === 'flex'"
      [class.open]="mark.kind === 'unfinished'"
      [attr.x]="mark.x"
      [attr.y]="mark.y"
    >{{ mark.text }}</text>
  }
</svg>
