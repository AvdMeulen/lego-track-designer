<div class="app-shell" [class.immersive]="immersive()">

      <span class="studs" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="brand-copy">
        <strong>{{ title() }}</strong>
        <small>Plan layouts from the City tracks you own</small>
      </span>
    </a>

    <nav class="nav">
