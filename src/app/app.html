<div class="app-shell" [class.immersive]="immersive()">
  <header class="top-bar">
    <a class="brand" routerLink="/">
      <span class="studs" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="brand-copy">
        <strong>{{ 'app.title' | t }}</strong>
        <small>{{ 'app.tagline' | t }}</small>
      </span>
    </a>

    <div class="top-actions">
      <nav class="nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.home' | t }}</a>
        <a routerLink="/inventory" routerLinkActive="active">{{ 'nav.inventory' | t }}</a>
        <a routerLink="/designer" routerLinkActive="active">{{ 'nav.designer' | t }}</a>
      </nav>
      <app-language-toggle />
    </div>
  </header>

  <main class="content" [class.immersive]="immersive()">
    <router-outlet />
  </main>
</div>
